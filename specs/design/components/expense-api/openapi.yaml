openapi: 3.0.3
info:
  title: Expense API
  version: 0.1.0
  description: Expense claims, approvals, payroll export and notifications.
servers:
  - url: /
paths:
  /me/claims:
    get:
      operationId: listMyClaims
      summary: The caller's own expense claims
      security:
        - oauth2: [claims:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        '200':
          description: A page of the caller's claims
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExpenseClaim' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: submitClaim
      summary: Create and submit a new expense claim
      security:
        - oauth2: [claims:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseClaimCreate' }
      responses:
        '201':
          description: Claim created and submitted for approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: Missing a required field, or no receipt attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/claims/{claimId}:
    get:
      operationId: getMyClaim
      summary: One of the caller's own claims
      security:
        - oauth2: [claims:read]
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '404':
          description: No such claim of the caller's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: editMyClaim
      summary: Edit a claim still pending a decision
      security:
        - oauth2: [claims:edit]
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseClaimUpdate' }
      responses:
        '200':
          description: Updated claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: The claim is no longer pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such claim of the caller's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: withdrawMyClaim
      summary: Withdraw a claim still pending a decision
      security:
        - oauth2: [claims:withdraw]
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '204':
          description: Claim withdrawn
        '400':
          description: The claim is no longer pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such claim of the caller's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/team/claims:
    get:
      operationId: listTeamClaims
      summary: Pending claims submitted by the caller's direct reports
      security:
        - oauth2: [claims:review-team]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        '200':
          description: A page of the team's claims
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExpenseClaim' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/team/claims/{claimId}:
    get:
      operationId: getTeamClaim
      summary: One of the caller's direct reports' claims, with its receipt
      security:
        - oauth2: [claims:review-team]
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '404':
          description: No such claim among the caller's direct reports
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /claims/{claimId}/approve:
    post:
      operationId: approveClaim
      summary: Approve a submitted claim
      security:
        - oauth2: [claims:approve]
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Claim approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: The claim is not pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /claims/{claimId}/reject:
    post:
      operationId: rejectClaim
      summary: Reject a submitted claim with a reason
      security:
        - oauth2: [claims:reject]
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, description: Why the claim was rejected }
      responses:
        '200':
          description: Claim rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: The claim is not pending, or no reason was given
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /claims:
    get:
      operationId: listApprovedClaims
      summary: Every approved claim, for payroll export
      security:
        - oauth2: [claims:read-all]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: exported
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: A page of approved claims
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExpenseClaim' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /claims/export:
    post:
      operationId: exportApprovedClaims
      summary: Download a payroll file of approved, unexported claims and mark them exported
      security:
        - oauth2: [claims:export]
      responses:
        '200':
          description: A CSV payroll file of the claims just exported
          content:
            text/csv:
              schema: { type: string }
        '400':
          description: No approved, unexported claims to export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/notifications:
    get:
      operationId: listMyNotifications
      summary: The caller's own in-app notifications
      security:
        - oauth2: [notifications:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of the caller's notifications
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  parameters:
    ClaimId:
      name: claimId
      in: path
      required: true
      schema: { type: string }
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            claims:read: The caller's own claims
            claims:submit: Create and send a claim
            claims:edit: Edit a pending claim of the caller's
            claims:withdraw: Withdraw a pending claim of the caller's
            claims:review-team: The caller's direct reports' claims
            claims:approve: Approve a submitted claim
            claims:reject: Reject a submitted claim
            claims:read-all: Every claim
            claims:export: Export approved claims to payroll
            notifications:read: The caller's own notifications
  schemas:
    ExpenseClaim:
      type: object
      required: [id, employeeId, amount, expenseDate, merchant, category, receiptUrl, status, createdAt]
      properties:
        id: { type: string }
        employeeId: { type: string }
        amount: { type: number, format: double }
        expenseDate: { type: string, format: date }
        merchant: { type: string }
        category: { type: string, description: One of a fixed, admin-maintained list }
        receiptUrl: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        rejectionReason: { type: string, nullable: true }
        exportedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    ExpenseClaimCreate:
      type: object
      required: [amount, expenseDate, merchant, category, receiptUrl]
      properties:
        amount: { type: number, format: double }
        expenseDate: { type: string, format: date }
        merchant: { type: string }
        category: { type: string }
        receiptUrl: { type: string }
    ExpenseClaimUpdate:
      type: object
      properties:
        amount: { type: number, format: double }
        expenseDate: { type: string, format: date }
        merchant: { type: string }
        category: { type: string }
        receiptUrl: { type: string }
    Notification:
      type: object
      required: [id, type, message, read, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [claim-submitted, claim-decided] }
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
security:
  - oauth2: []
